    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="一个动态歌词播放器，支持 AI 主题生成" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
      html, body { height: 100%; overscroll-behavior: none; }
      body { margin: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      @supports (padding: env(safe-area-inset-bottom)) {
        body {
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        body {
          --folia-controls-scale: 0.78;
        }
      }
      @media (orientation: landscape) and (max-height: 400px) {
        body {
          --folia-controls-scale: 0.68;
        }
      }
      #folia-back-btn{display:none;position:fixed;z-index:9999;top:18px;left:18px;height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:linear-gradient(180deg,rgba(143,240,224,.14),rgba(0,0,0,.44) 55%,rgba(0,0,0,.56));color:rgba(237,246,244,.86);font-family:inherit;font-size:12px;font-weight:720;letter-spacing:.06em;cursor:pointer;align-items:center;justify-content:center;gap:7px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.10)}
      #folia-back-btn::before{content:'';width:6px;height:6px;border-radius:50%;background:#8ff0e0;box-shadow:0 0 10px rgba(143,240,224,.6);flex-shrink:0}
      #folia-back-btn:hover{color:#fff;border-color:rgba(143,240,224,.38);background:linear-gradient(180deg,rgba(143,240,224,.22),rgba(0,0,0,.5) 55%,rgba(0,0,0,.6))}
    </style>

  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.3",
    "i18next-browser-languagedetector": "https://aistudiocdn.com/i18next-browser-languagedetector@^8.2.0"
  }
}
</script>
  <script type="module" crossorigin src="./assets/main-DUe38DPr.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-CNC7AqOf.js">
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Dezn_h7o.js">
</head>
  <body>
    <div id="root"></div>
    <button id="folia-back-btn" type="button" onclick="switchToPlayer()" title="返回播放器" aria-label="返回播放器">返回播放器</button>
    <script>
      function switchToPlayer() {
        try {
          if (window.AndroidBridge && typeof window.AndroidBridge.switchToPlayer === 'function') {
            window.AndroidBridge.switchToPlayer();
          } else if (window.history && window.history.length > 1) {
            window.history.back();
          }
        } catch (e) {}
      }
      (function () {
        var btn = document.getElementById('folia-back-btn');
        if (window.AndroidBridge && typeof window.AndroidBridge.switchToPlayer === 'function') {
          btn.style.display = 'inline-flex';
        }
      })();
    </script>
    <script>
      // Android WebView 内禁用 Service Worker，避免 / 范围拦截本地资源与 API 请求
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
    </script>
  </body>
</html>
